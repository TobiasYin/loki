<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Thor Agent</title><link rel="stylesheet" href="style.css"><script src="runtime-host.js" defer></script><script src="ui.js" defer></script></head>
<body>
<div class="shell">
<header><button id="menu" aria-label="打开会话列表">☰</button><div class="heading"><h1 id="title">Thor Agent</h1><span>Pi · Native 授权与工具</span></div><button id="new" aria-label="新建会话">＋</button><button id="settings" aria-label="Native 设置">⚙</button></header>
<div id="active" class="active" hidden></div><div id="notice" class="notice" role="alert" hidden></div>
<main id="chat" aria-label="聊天记录" tabindex="0"><div class="empty">从一个问题开始。<br>请配置模型并完成图片与工具探测。</div></main>
<footer><form id="composer"><label class="sr" for="input">消息</label><textarea id="input" rows="2" maxlength="8000" placeholder="输入问题…"></textarea><div class="controls"><button type="button" id="capabilities" aria-expanded="false">能力 · 2 项 ⌄</button><label class="scenario-label" hidden><span class="sr">模拟场景</span><select id="scenario" aria-label="模拟场景"><option value="success">多工具成功</option><option value="failure">工具失败</option><option value="waiting">等待批准</option><option value="unknown">未知副作用</option><option value="long">长回答</option><option value="many">30 项事件</option></select></label><button id="attach" type="button">附图</button><button id="send" type="submit" class="primary">发送</button></div></form><section id="cap-panel" class="cap-panel" aria-label="会话能力" hidden></section></footer>
</div>
<div id="shade" class="shade" hidden></div><aside id="drawer" class="drawer" aria-label="会话列表" hidden><div class="drawer-head"><h2>会话</h2><button id="close-drawer" aria-label="关闭列表">×</button></div><button id="drawer-new" class="wide">＋ 新建会话</button><div id="sessions"></div><button id="archives" class="wide">查看归档</button><button id="seed" class="wide" hidden>加载长历史示例</button><button id="drawer-settings" class="wide">连接与设备设置</button><small>真实模型与设备状态以 Native 检查为准。</small></aside>
<dialog id="modal"><form method="dialog" id="modal-form"><h2 id="modal-title"></h2><p id="modal-text"></p><input id="modal-input" maxlength="80" aria-label="会话标题" hidden><div class="dialog-actions"><button value="cancel">取消</button><button id="modal-ok" value="ok" class="primary">确认</button></div></form></dialog>
</body></html>
